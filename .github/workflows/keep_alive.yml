name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:          # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Frambit Backend
        run: |
          curl -m 120 -s -o /dev/null -w "Status: %{http_code} | Time: %{time_total}s" \
          https://frambit.onrender.com/api/categories/ || echo "Server warming up..."
