services:
  # =========================================================================
  # Frambit Django REST Framework Backend API Service
  # =========================================================================
  - type: web
    name: frambit-api
    runtime: python
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: frambit-db
          property: connectionString

# =========================================================================
# Managed PostgreSQL Database
# =========================================================================
databases:
  - name: frambit-db
    databaseName: frambit
    user: frambit_user
    plan: free
